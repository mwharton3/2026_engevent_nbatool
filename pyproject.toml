[project]
name = "nba-surge"
version = "0.1.0"
description = "Find NBA players whose performance jumped in the past week, and judge whether it will last."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nba-surge = "nba_surge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_surge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
